<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>澳洲四城行程地图</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Layout: date rail pinned on top; wide screens keep the map pinned on the left while the day's itinerary scrolls on the right; phones stack map over itinerary.
   The map is Leaflet (loaded at runtime from a CDN) on OpenStreetMap tiles (CARTO if a key is set); its stylesheet is inserted before this one so the rules below win. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#16232B; --muted:#5B6B75; --line:#D3DDE2; --soft:#E4EBEF;
  --land:#F7F6F2; --sea:#CADCE4; --coast:#9AB5C1; --sea-ink:#477A8E; --grid:rgba(22,35,43,.075); --halo:rgba(247,246,242,.92);
  --syd:#1E5EA8; --mel:#2E7A52; --gc:#B06F08; --bne:#7347AE; --air:#3B4A53;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1519; --surface:#162027; --ink:#E2E9EC; --muted:#93A4AD; --line:#2A3941; --soft:#1C2930;
    --land:#18232A; --sea:#0C1D25; --coast:#2D4C5A; --sea-ink:#7BB0C3; --grid:rgba(226,233,236,.06); --halo:rgba(24,35,42,.9);
    --syd:#74ABEE; --mel:#66C896; --gc:#E5AD4A; --bne:#B793F0; --air:#B9C6CD; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1519; --surface:#162027; --ink:#E2E9EC; --muted:#93A4AD; --line:#2A3941; --soft:#1C2930;
  --land:#18232A; --sea:#0C1D25; --coast:#2D4C5A; --sea-ink:#7BB0C3; --grid:rgba(226,233,236,.06); --halo:rgba(24,35,42,.9);
  --syd:#74ABEE; --mel:#66C896; --gc:#E5AD4A; --bne:#B793F0; --air:#B9C6CD; color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--syd);outline-offset:2px;border-radius:6px}

.wrap{padding-inline:16px;max-width:1440px;margin-inline:auto}
.masthead{padding-block:18px 6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.masthead h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4.6vw,30px);line-height:1.2;margin:0;letter-spacing:.02em;text-wrap:balance}
.masthead .route{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
.masthead .route b{font-weight:500;color:var(--ink)}
.masthead .route i{font-style:normal;color:var(--muted)}

/* date rail */
.railbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:9px;scroll-padding-inline:16px}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;display:grid;grid-template-columns:auto auto;align-items:baseline;column-gap:5px;row-gap:0;min-width:66px;padding:5px 10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;position:relative;line-height:1.25}
.chip::before{content:"";position:absolute;left:9px;right:9px;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--c,var(--muted))}
.chip .md{font-family:var(--f-mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.chip .wd{font-size:12px;color:var(--muted)}
.chip .ct{grid-column:1 / -1;font-size:11.5px;color:var(--muted);white-space:nowrap}
.chip.ov{grid-template-columns:auto;align-content:center}
.chip.ov .md{font-family:var(--f-body);font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .wd,.chip[aria-pressed="true"] .ct{color:var(--bg);opacity:.8}
.chip .today{position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--syd));box-shadow:0 0 0 2px var(--surface)}
.chip.sep{margin-left:8px}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-block:14px 40px}
.map{position:relative;isolation:isolate;scroll-margin-top:calc(var(--rail) + 8px);height:min(58svh,540px);min-height:320px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--land);touch-action:none;user-select:none;-webkit-user-select:none}
.lmap{position:absolute;inset:0}
.map:not(.ready) .tools,.map:not(.ready) .mapnote{display:none}
.map.nomap{height:auto;min-height:0;touch-action:auto;user-select:auto;-webkit-user-select:auto}
.map.nomap .lmap{display:none}
.mapmsg{position:absolute;inset:0;z-index:500;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px;padding:14px 16px;text-align:center;font-size:13px;color:var(--muted)}
.mapmsg p{margin:0;max-width:44ch}
.map.nomap .mapmsg{position:static;justify-content:flex-start;text-align:left}
.tools{position:absolute;z-index:500;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:34px;height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tgroup{display:flex;flex-direction:column;border-radius:9px;overflow:hidden;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tgroup .tbtn{border:0;border-radius:0;box-shadow:none;font-family:var(--f-mono);font-size:17px;width:34px;padding:0}
.tgroup .tbtn+.tbtn{border-top:1px solid var(--line)}
.mapnote{position:absolute;z-index:500;left:10px;top:10px;max-width:calc(100% - 140px);font-size:11.5px;line-height:1.4;color:var(--muted);background:var(--halo);padding:4px 8px;border-radius:7px}
.mapnote .tw{display:none}
.mapnote.warn .tw{display:block;margin-top:3px;padding-top:3px;border-top:1px solid var(--line);color:var(--ink)}
/* Leaflet 外观跟随页面主题 */
.lmap.leaflet-container{background:var(--land);font-family:var(--f-body);font-size:13px;line-height:1.5}
/* OSM 瓦片：浅色时略降饱和度，让路线更显眼；深色时反色调暗 */
.lmap.tiles-osm .leaflet-tile-pane{filter:saturate(.7)}
.lmap.tiles-osm.tiles-dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.55)}
.lmap .leaflet-control-attribution{background:var(--halo);color:var(--muted);font-size:10.5px;line-height:1.5;padding:1px 6px;border-top-left-radius:6px}
.lmap .leaflet-control-attribution a{color:var(--ink);text-decoration:none}
.lmap .leaflet-control-scale{margin:0 0 8px 10px}
.lmap .leaflet-control-scale-line{background:var(--halo);border-color:var(--ink);color:var(--ink);font:500 10.5px/1.5 var(--f-mono)}
.lmap .leaflet-popup-content-wrapper{background:var(--surface);color:var(--ink);border-radius:12px;padding:0;box-shadow:0 0 0 1px var(--line),0 6px 24px rgba(10,20,26,.22)}
.lmap .leaflet-popup-tip{background:var(--surface);box-shadow:none}
.lmap .leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.5}
.lmap a.leaflet-popup-close-button{top:4px;right:4px;width:26px;height:26px;font:18px/26px var(--f-body);color:var(--muted)}
.pop h4{margin:0 22px 2px 0;font-size:14.5px;line-height:1.35}
.pop .en{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.lmap .pop p{margin:6px 0 8px;color:var(--ink)}
.pop .links{display:flex;flex-wrap:wrap;gap:6px}
.lmap .pop .lk{color:var(--ink)}
/* 路线（Leaflet 的 SVG 路径，className 带过来） */
.ctx{fill:var(--muted);fill-opacity:.4}
.rt{fill:none;stroke-linecap:round;stroke-linejoin:round}
.rt.m-walk{stroke-width:3.4}
.rt.m-transit{stroke-width:2.8;stroke-dasharray:7 5}
.rt.m-ferry{stroke-width:3.2;stroke-dasharray:.5 6;stroke:var(--sea-ink)!important}
.rt.m-tour{stroke-width:2.8;stroke-dasharray:14 5 3 5}
.rt.m-flight{stroke-width:2;stroke-dasharray:9 6;stroke:var(--air)!important}
.rt.opt{opacity:.45}
.rt.syd{stroke:var(--syd)} .rt.mel{stroke:var(--mel)} .rt.gc{stroke:var(--gc)} .rt.bne{stroke:var(--bne)}
/* 点标记（divIcon；尺寸由 iconSize 决定，里面的元素铺满） */
.mk{cursor:pointer}
.mk.syd{--c:var(--syd)} .mk.mel{--c:var(--mel)} .mk.gc{--c:var(--gc)} .mk.bne{--c:var(--bne)}
.mk .ring{position:absolute;inset:-6px;border:2px solid var(--ink);border-radius:50%;opacity:0;pointer-events:none}
.mk.sel .ring{opacity:1}
.mk .dot{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:var(--c);border:2px solid var(--surface);color:var(--surface);font:600 11px/1 var(--f-mono);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mk.opt .dot{background:var(--surface);color:var(--c);border-color:var(--c)}
.mk.stay .dot,.mk.air .dot{font:700 11.5px/1 var(--f-body)}
.mk.city .dot{border-width:3px;font-size:12px}
.mk .box{display:block;width:100%;height:100%;border-radius:5px;background:var(--ink);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mk .box svg{display:block;width:100%;height:100%;fill:none;stroke:var(--surface);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mk.htl .ring{border-radius:10px}
.mk.htl.area .box{background:var(--surface);border:1.5px dashed var(--ink)}
.mk.htl.area .box svg{stroke:var(--ink)}
.mk.base .box{background:var(--surface);border:1.6px solid var(--muted)}
.mk.base .box svg{stroke:var(--muted)}
.mk.base .ring{border-radius:9px}
.mk.htl.booked .box{background:var(--c);border-width:2.5px;box-shadow:0 0 0 2px var(--c),0 2px 8px rgba(0,0,0,.35)}
.mk.htl.booked .ring{inset:-7px;border-radius:12px}
.mk.htl.booked .ck{position:absolute;right:-7px;top:-7px;width:16px;height:16px;border-radius:50%;background:var(--ink);color:var(--surface);border:1.5px solid var(--surface);font:700 10px/13px var(--f-body);text-align:center}
/* 标签：零尺寸锚点里的文字，位置由脚本避让后决定 */
.lbm .lb{position:absolute;left:0;top:0;padding:0 2px;white-space:nowrap;font:500 12px/16px var(--f-body);color:var(--ink);visibility:hidden;text-shadow:0 0 1px var(--halo),0 0 2px var(--halo),0 0 3px var(--halo),0 0 4px var(--halo),0 0 6px var(--halo)}
.lbm .lb.h{font-size:11.5px;font-weight:400}
.lbm .lb.c{font-size:13.5px;font-weight:700;line-height:18px}
.lbm .lb.f{font:500 10.5px/14px var(--f-mono);color:var(--muted)}
.lbm .lb.dim{color:var(--muted);font-weight:400}
.lbm .lb.bk{font-weight:700;color:var(--c)}
/* 交通：线路号标签（列表和地图共用），颜色按交通方式 */
.ln{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;padding:0 6px;border-radius:5px;font:600 11.5px/1 var(--f-mono);color:#fff;background:var(--lc,#4B5563);white-space:nowrap}
.ln.train{--lc:#C2571A} .ln.metro{--lc:#0B6E74} .ln.tram{--lc:#2F7D32} .ln.lrt{--lc:#B3122B} .ln.bus{--lc:#1D63A6} .ln.ferry{--lc:#0A7A70} .ln.taxi,.ln.car{--lc:#4B5563}
.ln.walk{background:transparent;color:var(--muted);border:1px solid var(--line);font:500 11.5px/1 var(--f-body)}
.lnbm{cursor:pointer}
.lnbm .ln{width:100%;height:100%;padding:0;box-shadow:0 0 0 2px var(--surface),0 1px 4px rgba(0,0,0,.3)}
.lnbm.opt{opacity:.6}
.lnbm.sel .ln{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.xdot{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.lbm .lb.syd{--c:var(--syd)} .lbm .lb.mel{--c:var(--mel)} .lbm .lb.gc{--c:var(--gc)} .lbm .lb.bne{--c:var(--bne)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);padding:8px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:30px;height:8px;overflow:visible}
.legend line{stroke:var(--muted);stroke-linecap:round}

/* panel */
.panel{min-width:0}
.dayhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:end;padding-bottom:12px;border-bottom:1px solid var(--line)}
.bigdate{grid-row:span 2;font-family:var(--f-mono);font-weight:600;font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bigdate small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:0;color:var(--muted);margin-top:6px}
.tagline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.ctag{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--ink)}
.ctag::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.dayhead h2{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.6vw,28px);line-height:1.25;margin:0;text-wrap:balance}
.lede{margin:12px 0 0;color:var(--ink);max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.meta .mono{font-family:var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.pager{display:flex;gap:8px;margin-top:12px}
.pbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px}
.pbtn:disabled{opacity:.4;cursor:default}

.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.opts .lab{width:100%;font-size:12.5px;color:var(--muted)}
.obtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13.5px;cursor:pointer}
.obtn[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}

h3.sec{font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
h3.sec::after{content:"";flex:1;height:1px;background:var(--line)}

.xfers{display:grid;gap:8px}
.xfer{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;position:relative}
.xfer .who{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.xfer .who b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.xfer .end{font-family:var(--f-mono);font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.xfer .end.r{text-align:right}
.xfer .arrow{color:var(--muted);font-family:var(--f-mono)}
.xfer .nt{grid-column:1 / -1;font-size:12.5px;color:var(--muted)}

.stops{list-style:none;margin:0;padding:0;position:relative}
.stop{display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 12px;position:relative;padding-bottom:14px;cursor:pointer;border-radius:10px}
.stop::before{content:"";position:absolute;left:14px;top:26px;bottom:-2px;width:2px;background:var(--c);opacity:.28}
.stop:last-child::before{display:none}
.stop .n{width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--surface);font-family:var(--f-mono);font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;margin-top:1px;position:relative;z-index:1}
.stop.opt .n{background:var(--surface);color:var(--c);border:2px solid var(--c)}
.stop.stay .n,.stop.air .n{font-size:14px}
.stop .body{min-width:0;padding:2px 8px 6px;margin-left:-8px;border-radius:10px;transition:background .2s}
.stop.on .body{background:var(--soft)}
.stop .ttl{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.stop .nm{font-weight:700;font-size:15.5px}
.stop .t{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stop .en{font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.4}
.stop .via{display:inline-block;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-bottom:4px;background:var(--surface)}
.stop .note{margin:4px 0 0;font-size:13.5px;color:var(--ink);max-width:60ch}
.stop .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tx{display:grid;gap:8px;margin:6px 0 4px;padding:9px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.txr{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:9px;align-items:start;font-size:13px;line-height:1.45}
.txr>.ln{grid-row:span 4;margin-top:1px}
.txr>span:not(.ln){grid-column:2;min-width:0}
.txr .tk{font-weight:600}
.txr .tm{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.txr .tn{font-size:12.5px;color:var(--muted)}
.txr.walk{align-items:center}
.tx .txl{justify-self:start}
.txsum{display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted)}
.txsum span:first-child{margin-right:2px}
.tips.pay li{list-style:none;margin-left:-1.1em}
.lk{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:2px 9px;background:var(--surface);color:var(--ink);white-space:nowrap}
.lk:hover{border-color:var(--muted)}
.lk.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.routebtn{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;height:42px;border-radius:11px;text-decoration:none;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500}

.tips{margin:0;padding-left:1.1em;display:grid;gap:6px;font-size:13.5px;max-width:64ch}
.tips li::marker{color:var(--muted)}

.hotels{display:grid;gap:8px}
.hstay{font-size:13px;color:var(--muted);margin:-2px 0 4px}
.hstay b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.hotel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.hotel.on{border-color:var(--ink)}
.hotel.booked{border-color:var(--c);box-shadow:inset 3px 0 0 var(--c)}
.hotel .hn .bk{font-size:11.5px;font-weight:700;line-height:1.6;padding:0 7px;border-radius:5px;background:var(--c);color:var(--surface);align-self:center}
.hstay .bkn{font-weight:700;color:var(--ink)}
.hotel .hn{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.hotel .hn b{font-size:14.5px}
.hotel .hn span{font-size:12.5px;color:var(--muted)}
.hotel .tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 4px}
.tag{font-size:12px;border-radius:5px;padding:1px 7px;background:var(--soft);color:var(--ink)}
.tag.d{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hotel p{margin:2px 0 6px;font-size:13px}
.hotel .links{display:flex;flex-wrap:wrap;gap:6px}

/* overview */
.dlist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.drow{display:grid;grid-template-columns:52px 28px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.drow.static{cursor:default;background:transparent;border-style:dashed}
.drow .md{font-family:var(--f-mono);font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.drow .wd{font-size:12.5px;color:var(--muted)}
.drow .tt{min-width:0}
.drow .tt b{font-weight:500;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .tt span{font-size:12px;color:var(--muted)}
.drow .nt{font-size:12px;color:var(--muted);white-space:nowrap}
.drow .bar{grid-column:1 / -1;display:none}
.dot-c{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.ftable{width:100%;border-collapse:collapse;font-size:13px}
.ftable td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.ftable td:first-child{padding-left:0;white-space:nowrap;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ftable .r{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ftable .sub{display:block;color:var(--muted);font-size:12px}
.tblwrap{overflow-x:auto}
.stays{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stays div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stays b{display:block;font-size:14px}
.stays .n{font-family:var(--f-mono);font-size:22px;font-weight:600;line-height:1.2}
.stays span{font-size:12.5px;color:var(--muted)}
.stays .bkd{display:block;margin-top:4px;color:var(--ink);font-weight:500}
.fine{font-size:12.5px;color:var(--muted);max-width:64ch;margin:18px 0 0}

@media (min-width: 900px){
  .wrap{padding-inline:24px}

}

function decodePl(s){
  var pts=[], i=0, lat=0, lng=0;
  function next(){ var b, sh=0, r=0; do{ b=s.charCodeAt(i++)-63; r|=(b&31)<<sh; sh+=5; }while(b>=32); return (r&1) ? ~(r>>1) : (r>>1); }
  while(i<s.length){ lat+=next(); lng+=next(); pts.push([lat/1e5, lng/1e5]); }
  return pts;
}
// 有取到的形状就用，没有就按途经点连直线
function geoPts(g){ var e=GEO[segKey(g)]; return e ? decodePl(e) : [g.A].concat(g.via||[]).concat([g.B]); }

/* ---------- 日出日落（简化天文算法，约 ±2 分钟） ---------- */
function sunTimes(dateStr, lat, lon, tz){
  var p = dateStr.split('-').map(Number);
  var jd0 = Date.UTC(p[0],p[1]-1,p[2])/86400000 + 2440587.5;
  var n = Math.ceil(jd0 - 2451545.0 + 0.0008);
  var Js = n - lon/360;
  var M = (357.5291 + 0.98560028*Js) % 360;
  var C = 1.9148*Math.sin(M*D2R) + 0.02*Math.sin(2*M*D2R) + 0.0003*Math.sin(3*M*D2R);
  var lam = (M + C + 180 + 102.9372) % 360;
  var Jt = 2451545.0 + Js + 0.0053*Math.sin(M*D2R) - 0.0069*Math.sin(2*lam*D2R);
  var dec = Math.asin(Math.sin(lam*D2R)*Math.sin(23.4397*D2R));
  var cw = (Math.sin(-0.833*D2R) - Math.sin(lat*D2R)*Math.sin(dec))/(Math.cos(lat*D2R)*Math.cos(dec));
  var w = Math.acos(Math.max(-1,Math.min(1,cw)))/D2R;
  function fmt(J){ var ms=(J-2440587.5)*86400000 + tz*3600000; var d=new Date(ms); var h=d.getUTCHours(), m=d.getUTCMinutes()+(d.getUTCSeconds()>=30?1:0); if(m===60){m=0;h=(h+1)%24;} return (h<10?'0':'')+h+':'+(m<10?'0':'')+m; }
  return {rise:fmt(Jt - w/360), set:fmt(Jt + w/360)};
}

/* ---------- 链接 ---------- */
function gmSearch(q){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q); }
function gmDir(pts, mode){
  var o=pts[0], d=pts[pts.length-1], w=pts.slice(1,-1);
  var u='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(o)+'&destination='+encodeURIComponent(d)+'&travelmode='+mode;
  if(w.length) u+='&waypoints='+w.map(encodeURIComponent).join('%7C');
  return u;
}
function booking(h, c){ return 'https://www.booking.com/searchresults.html?ss='+encodeURIComponent(h.q)+'&checkin='+c.cin+'&checkout='+c.cout+'&group_adults=2&no_rooms=1&group_children=0'; }
function haversine(a,b){ var R=6371, dLat=(b[0]-a[0])*D2R, dLon=(b[1]-a[1])*D2R; var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a[0]*D2R)*Math.cos(b[0]*D2R)*Math.sin(dLon/2)*Math.sin(dLon/2); return 2*R*Math.asin(Math.sqrt(x)); }

  var prev=null;
  DAYS.forEach(function(d){
    var c=CITY[d.city], md=d.date.slice(5).replace('-','/');
    var ct = d.night && d.night!==d.city ? c.name+' → '+CITY[d.night].name : (d.night? c.name : c.name+' → 回国');
    h += '<button class="chip'+(prev && prev!==d.city?' sep':'')+'" type="button" data-v="'+d.id+'" style="--c:var(--'+d.city+')"><span class="md">'+md+'</span><span class="wd">'+d.wd.slice(1)+'</span><span class="ct">'+esc(ct)+'</span>'+(d.date===TODAY?'<span class="today" title="今天"></span>':'')+'</button>';
    prev=d.city;
  });

}
function syncRail(){

  rail.querySelectorAll('.chip').forEach(function(b){ var a=b.getAttribute('data-v')===S.view; b.setAttribute('aria-pressed', a?'true':'false'); if(a) on=b; });
  if(on){ var r=rail.getBoundingClientRect(), br=on.getBoundingClientRect(); if(br.left<r.left+8 || br.right>r.right-8){ rail.scrollTo({left: rail.scrollLeft + (br.left - r.left) - (r.width-br.width)/2, behavior: reduce()?'auto':'smooth'}); } }
}
function reduce(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

/* ---------- 地图（Leaflet + OpenStreetMap 底图） ---------- */
var mapBox=document.getElementById('map'), mapEl=document.getElementById('lmap'), mapnote=document.getElementById('mapnote'), mapmsg=document.getElementById('mapmsg'), btnHotels=document.getElementById('btnHotels');
// Leaflet 固定 1.9.4。先试 unpkg，失败或超时换 cdnjs；integrity 保证文件没被改过

};

var LF=null, map=null, tiles=null, tileUrlNow='', tileStat={ok:0,err:0}, cssOk=false;
var scene=null, FITB=null, FITZ=0, lastKey=null;
var BED = 'M-5.5 3.5V-3.5M-5.5 1.2H5.5V3.5M-5.5 1.2V-.6H-.6V1.2M.2 -.6H3.6A1.9 1.9 0 0 1 5.5 1.3';
var BED_SVG = '<svg viewBox="-10 -10 20 20" aria-hidden="true"><path d="'+BED+'"/></svg>';

/* 底图跟随页面浅色 / 深色 */
var darkMq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function isDark(){ var t=document.documentElement.getAttribute('data-theme'); return t==='dark' || (t!=='light' && !!(darkMq && darkMq.matches)); }
function tileUrl(){
  return CARTO_KEY ? 'https://basemaps.cartocdn.com/rastertiles/'+(isDark()?'dark_all':'light_all')+'/{z}/{x}/{y}{r}.png?key='+encodeURIComponent(CARTO_KEY)
                   : 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
}
function syncTiles(){
  mapEl.classList.toggle('tiles-osm', !CARTO_KEY);
  mapEl.classList.toggle('tiles-dark', isDark());
  if(!tiles) return; var u=tileUrl(); if(u===tileUrlNow) return; tileUrlNow=u; tileStat={ok:0,err:0}; setTileWarn(false); tiles.setUrl(u);
}

/* 加载：loading → ready；失败时地图区收成一行提示，列表照常可用 */
function setMapState(st){
  mapBox.classList.toggle('ready', st==='ready');
  mapBox.classList.toggle('nomap', st==='failed');
  document.querySelector('.legend').hidden = st==='failed';
  if(st==='ready'){ mapmsg.hidden=true; return; }
  mapmsg.hidden=false;
  mapmsg.innerHTML = st==='failed'
    ? '<p>地图没有加载出来，可能是网络限制。下面的行程、酒店和每站的「地图」链接照常可用。</p><button class="tbtn" type="button">重试</button>'
    : '<p>地图加载中…</p>';
  var b=mapmsg.querySelector('button'); if(b) b.addEventListener('click', function(){ loadLeaflet(0); });
}
function loadLeaflet(i){
  var src=LEAFLET.src[i];
  if(!src){ setMapState('failed'); return; }
  setMapState('loading');
  var done=false, timer=setTimeout(next, 10000);
  function next(){ if(done) return; done=true; clearTimeout(timer); if(!tryInit()) loadLeaflet(i+1); }
  function loaded(){ if(tryInit()){ done=true; clearTimeout(timer); } }
  function add(tag, at, onload){
    var e=document.createElement(tag); for(var k in at) e[k]=at[k]; e.crossOrigin='anonymous';
    e.onload=onload; e.onerror=function(){ e.remove(); next(); };
    // 样式表放在最前面，页面自己的样式才能覆盖 Leaflet 默认样式
    if(tag==='link') document.head.insertBefore(e, document.head.firstChild); else document.head.appendChild(e);
  }
  if(!cssOk) add('link', {rel:'stylesheet', href:src.css, integrity:LEAFLET.sri.css}, function(){ cssOk=true; loaded(); });
  if(!window.L) add('script', {src:src.js, integrity:LEAFLET.sri.js}, loaded);
  loaded();
}
function tryInit(){ if(map) return true; if(!cssOk || !window.L || !window.L.map) return false; initMap(); return true; }

function initMap(){
  LF = window.L;
  setMapState('ready');
  var still = reduce();
  map = LF.map(mapEl, {zoomControl:false, keyboard:false, trackResize:false, zoomSnap:.25, minZoom:3, maxZoom:19, zoomAnimation:!still, markerZoomAnimation:!still, fadeAnimation:!still});
  map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  LF.control.scale({imperial:false, maxWidth:100}).addTo(map);
  map.createPane('lbl').style.zIndex = 620;
  map.setView([-30,147], 4);
  tileUrlNow = tileUrl();
  tiles = LF.tileLayer(tileUrlNow, {maxZoom:CARTO_KEY?20:19, attribution:TILE_ATTR}).addTo(map);
  syncTiles();
  // 瓦片加载失败：地图照常显示路线和景点，只在提示里说明一句
  tiles.on('tileload', function(){ tileStat.ok++; setTileWarn(false); });
  tiles.on('tileerror', function(){ tileStat.err++; if(!tileStat.ok && tileStat.err>=4) setTileWarn(true); });
  map.on('zoomend moveend', placeLabels);
  map.on('popupclose', clearSel);
  if(darkMq){ if(darkMq.addEventListener) darkMq.addEventListener('change', syncTiles); else if(darkMq.addListener) darkMq.addListener(syncTiles); }
  if(window.MutationObserver) new MutationObserver(syncTiles).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
  if(window.ResizeObserver) new ResizeObserver(onResize).observe(mapBox); else window.addEventListener('resize', onResize);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(placeLabels);
  drawMap(false);
}
function onResize(){
  if(!map) return;
  var a=map.getSize(); map.invalidateSize({animate:false}); var b=map.getSize();
  if(scene && (Math.abs(a.x-b.x)>1 || Math.abs(a.y-b.y)>1)) fitTo(false);
}
function setNote(t){ mapnote.innerHTML = esc(t)+'<span class="tw">底图没加载出来（网络受限时会这样），路线和景点照常显示。</span>'; }
function setTileWarn(on){ if(mapnote.classList.contains('warn')!==on){ mapnote.classList.toggle('warn', on); placeLabels(); } }
function mapNote(d){
  if(!d) return REGION.au.note;
  if(d.region==='gor') return REGION.gor.note;
  return (Object.keys(GEO).length ? '路线沿实际道路和公交线路画（OpenStreetMap 数据）' : '路线按顺序直线连接，是示意')+'；彩色小标签是线路号，点开看怎么坐。';
}

/* 图层 */
function addMarker(ll, cls, html, size, name, z, group){
  var mk = LF.marker(ll, {icon:LF.divIcon({className:cls, html:html, iconSize:[size,size]}), zIndexOffset:z||0, riseOnHover:true});
  mk.on('add', function(){ var el=mk.getElement(); if(el) el.setAttribute('aria-label', name); });
  mk.addTo(group || scene.group);
  return mk;
}
function onActivate(mk, fn){
  mk.on('click', fn);
  mk.on('keydown', function(e){ var k=e.originalEvent.key; if(k==='Enter'||k===' '){ e.originalEvent.preventDefault(); fn(); } });
}
function addRoute(pts, mode, extra){ LF.polyline(pts, {className:'rt '+MCLS[mode]+(extra?' '+extra:''), interactive:false}).addTo(scene.group); }
// 线路号标签：放在这一小段路线的中点，点开看怎么坐；去程回程同一条线只放一个
function midOf(pts){
  var L=[0], i; for(i=1;i<pts.length;i++) L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0], (pts[i][1]-pts[i-1][1])*Math.cos(pts[i][0]*D2R)));
  var h=L[L.length-1]/2; for(i=1;i<pts.length;i++){ if(L[i]>=h){ var t=(h-L[i-1])/((L[i]-L[i-1])||1); return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t]; } }
  return pts[0];
}
function addBadge(g, pts, dim){
  var ll=midOf(pts), txt=g.line;
  if(scene.marks.some(function(m){ return m.badge===txt && Math.abs(m.ll[0]-ll[0])<0.002 && Math.abs(m.ll[1]-ll[1])<0.002; })) return;
  var w=Math.round(12+txt.length*7.2);
  var mk=LF.marker(ll, {icon:LF.divIcon({className:'lnbm'+(dim?' opt':''), html:'<span class="ln '+g.mode+'">'+esc(txt)+'</span>', iconSize:[w,20]}), zIndexOffset:280, riseOnHover:true});
  mk.on('add', function(){ var el=mk.getElement(); if(el) el.setAttribute('aria-label', txt+' '+TXMODE[g.mode]); });
  mk.addTo(scene.group);
  var m={mk:mk, ll:ll, r:w/2, badge:txt}; scene.marks.push(m);
  onActivate(mk, function(){ openPop(segPop(g), ll, 10); markSel(m); S.sel={type:'t'}; });
}
function segPop(g){
  return {n:(g.line?g.line+' ':'')+TXMODE[g.mode]+(g.dir?' · '+g.dir:''), en:(g.on||g.off)?(g.on||'')+' → '+(g.off||''):'',
    note:[g.time, g.freq, g.note].filter(Boolean).join('；'), links:'<a class="lk" href="'+gmGo(g.A, g.B, g.mode)+'" target="_blank" rel="noopener">实时查询</a>'};
}
// 标签是挂在锚点上的零尺寸 marker，位置由 placeLabels 避让后再定
function addLabel(text, cls, ll, r, prio, isHotel, dyn){
  var m = LF.marker(ll, {icon:LF.divIcon({className:'lbm', html:'<span class="lb'+(cls?' '+cls:'')+'">'+esc(text)+'</span>', iconSize:[0,0]}), pane:'lbl', interactive:false, keyboard:false});
  m.addTo(scene.group);
  scene.labels.push({m:m, ll:ll, r:r, prio:prio, hotel:!!isHotel, dyn:dyn});
}
// 航线弧线：在墨卡托平面上取二次贝塞尔曲线，任何缩放下形状都一样
function arcPts(a, b, bend){
  var A=proj(a), B=proj(b), dx=B[0]-A[0], dy=B[1]-A[1], C=[(A[0]+B[0])/2 - dy*bend, (A[1]+B[1])/2 + dx*bend], out=[];
  for(var i=0;i<=32;i++){ var t=i/32, u=1-t; out.push([unprojY(u*u*A[1]+2*u*t*C[1]+t*t*B[1]), u*u*A[0]+2*u*t*C[0]+t*t*B[0]]); }
  return out;
}

function buildScene(){
  if(scene){ map.removeLayer(scene.group); map.removeLayer(scene.hotelGroup); }
  map.closePopup();
  var sc = scene = {group:LF.layerGroup().addTo(map), hotelGroup:LF.layerGroup(), marks:[], labels:[], fit:[], hasHotels:false};
  var isOv = S.view==='overview', d = isOv?null:byId[S.view];
  setNote(mapNote(d));

  if(isOv){
    OV_LEGS.forEach(function(g){
      var pts=arcPts(g.a, g.b, g.bend);
      addRoute(pts, g.mode, g.mode==='train'?'gc':'');
      addLabel(g.lb, 'f', pts[16], 2, 3);
    });
    [{a:JINAN, b:[-33.9366,151.1658], lb:'济南 → 悉尼 10/23–24'},{a:[-27.3842,153.1175], b:JINAN, lb:'布里斯班 → 济南 11/3–4'}].forEach(function(g,i){
      addRoute([g.a, g.b], 'flight');
      var cityEnd = i===0 ? g.b : g.a, far = i===0 ? g.a : g.b;
      addLabel(g.lb, 'f', cityEnd, 2, 4, false, function(){
        var p1=map.latLngToContainerPoint(cityEnd), p2=map.latLngToContainerPoint(far), dx=p2.x-p1.x, dy=p2.y-p1.y, l=Math.hypot(dx,dy)||1, dd=Math.min(l*.5, 95);
        return map.containerPointToLatLng([p1.x+dx/l*dd, p1.y+dy/l*dd]);
      });
    });
    OV_CITIES.forEach(function(oc){
      var c=CITY[oc.c];
      var mk=addMarker(oc.ll, 'mk city '+oc.c, '<span class="ring"></span><span class="dot">'+oc.o+'</span>', 26, c.name, 300);
      sc.marks.push({mk:mk, ll:oc.ll, r:14}); sc.fit.push(oc.ll);
      onActivate(mk, function(){ setView(oc.go); });
      addLabel(c.name+' · '+c.nights+' 晚', 'c', oc.ll, 14, 1);
    });
    sc.fit.push([-38.9,146.4], [-26.9,153.7]);
  } else {
    var city=d.city, stops=dayStops(d), st=startPt(d), en=endPt(d), onMap = !d.region || d.region==='gc';
    // 同城其他天的点（淡显）
    if(onMap){
      DAYS.forEach(function(o){ if(o===d || o.city!==city || o.region==='gor') return;
        var arr = o.options ? o.options.reduce(function(a,op){return a.concat(op.stops);},[]) : o.stops;
        arr.forEach(function(s){ if(s.kind==='air'||s.kind==='stay') return; LF.circleMarker(s.ll, {radius:3.5, className:'ctx', interactive:false, stroke:false, fillOpacity:1}).addTo(sc.group); });
      });
    }
    // 每段路拆成小段画：步行、坐车各用自己的线型；换乘点画小圆点；坐车的段加线路号标签
    var badges=[];
    dayLegs(d).forEach(function(leg){
      var dim = !!leg.s.opt;
      legSegs(leg).forEach(function(g){
        var pts=geoPts(g);
        addRoute(pts, g.mode, city+(dim?' opt':''));
        if(g.mode==='walk') return;
        [g.A, g.B].forEach(function(p){ if(!nearLL(p, leg.from) && !nearLL(p, leg.to)) LF.circleMarker(p, {radius:3.5, className:'xdot', interactive:false}).addTo(sc.group); });
        if(g.line) badges.push([g, pts, dim]);
      });
    });
    // 住处（订了酒店时由下面的已订酒店标记代替）
    if(st || en){
      var same = st && en && st.ll[0]===en.ll[0] && st.ll[1]===en.ll[1];
      var bset = [st]; if(en && !same) bset.push(en);
      bset.forEach(function(b){ if(!b) return;
        if(b.booked){ sc.fit.push(b.ll); return; }
        var lab = b.n && b.n!=='住处出发' && b.n!=='回住处' ? b.n : '住处';
        var mk = addMarker(b.ll, 'mk base', '<span class="ring"></span><span class="box">'+BED_SVG+'</span>', 18, lab, 100);
        var m = {mk:mk, ll:b.ll, r:10}; sc.marks.push(m); sc.fit.push(b.ll);
        addLabel(lab, 'dim', b.ll, 10, 6);
        onActivate(mk, function(){ openPop({n:lab, en:b.en||'', note:b.note||'每天从住处出发；具体位置看你们最后订的酒店。'}, b.ll, 10); markSel(m); S.sel={type:'b'}; });
      });
    }
    var num=0;
    stops.forEach(function(s,i){
      var label = s.kind==='stay' ? '宿' : (s.kind==='air' ? '机' : String(++num));
      var mk = addMarker(s.ll, 'mk '+city+(s.opt?' opt':'')+(s.kind?' '+s.kind:''), '<span class="ring"></span><span class="dot">'+label+'</span>', 22, s.n, 300);
      sc.marks.push({mk:mk, ll:s.ll, r:12, i:i});
      if(!s.nofit && !s.opt && s.kind!=='air') sc.fit.push(s.ll);
      onActivate(mk, function(){ select(i, false); });
      addLabel(s.n, s.opt?'dim':'', s.ll, 12, 2);
    });
    badges.forEach(function(b){ addBadge(b[0], b[1], b[2]); });
    // 酒店：已订的始终显示、样式醒目；候选的跟随「酒店」开关
    if(onMap){
      (HOTELS[city]||[]).forEach(function(h,hi){
        var bk = isBooked(h);
        var mk = bk
          ? addMarker(h.ll, 'mk htl booked '+city, '<span class="ring"></span><span class="box">'+BED_SVG+'</span><span class="ck">✓</span>', 28, '已订 · '+h.n, 250)
          : addMarker(h.ll, 'mk htl'+(h.areaOnly?' area':''), '<span class="ring"></span><span class="box">'+BED_SVG+'</span>', 20, h.n, 0, sc.hotelGroup);
        sc.marks.push({mk:mk, ll:h.ll, r:bk?16:11, hotel:hi, booked:bk});
        if(bk) sc.fit.push(h.ll); else sc.hasHotels=true;
        onActivate(mk, function(){ selectHotel(hi, false); });
        addLabel(bk ? '已订 · '+(h.s||h.n) : (h.s||h.n), bk?'bk '+city:'h', h.ll, bk?16:11, bk?1.5:5, !bk);
      });
    }
  }
  if(S.hotels) sc.hotelGroup.addTo(map);
  btnHotels.setAttribute('aria-pressed', S.hotels?'true':'false');
}
function isBooked(h){ return !!h.booked && !h.areaOnly; }
function markVisible(m){ return m.hotel==null || m.booked || S.hotels; }

/* 标签避让：按优先级依次找不和点、其他标签、地图按钮重叠的位置，放不下就隐藏 */
function placeLabels(){
  if(!map || !scene) return;
  var sz=map.getSize(), W=sz.x, H=sz.y, boxes=[], base=mapEl.getBoundingClientRect();
  scene.marks.forEach(function(m){ if(!markVisible(m)) return; var p=map.latLngToContainerPoint(m.ll); boxes.push([p.x-m.r, p.y-m.r, p.x+m.r, p.y+m.r]); });
  [mapnote, document.querySelector('.tools'), mapEl.querySelector('.leaflet-control-scale'), mapEl.querySelector('.leaflet-control-attribution')].forEach(function(el){
    if(!el || !el.offsetParent) return; var r=el.getBoundingClientRect();
    boxes.push([r.left-base.left-4, r.top-base.top-4, r.right-base.left+4, r.bottom-base.top+4]);
  });
  var order = scene.labels.slice().sort(function(a,b){ return a.prio-b.prio; });
  order.forEach(function(lb){ var el=lb.m.getElement(); lb.el = el && el.firstChild; if(lb.el){ lb.w=lb.el.offsetWidth; lb.h=lb.el.offsetHeight; } });
  order.forEach(function(lb){
    if(!lb.el) return;
    if(lb.hotel && !S.hotels){ lb.el.style.visibility='hidden'; return; }
    if(lb.dyn){ lb.ll=lb.dyn(); lb.m.setLatLng(lb.ll); }
    var a=map.latLngToContainerPoint(lb.ll), w=lb.w, h=lb.h, r=lb.r+4;
    var cands=[[a.x+r, a.y-h/2],[a.x-r-w, a.y-h/2],[a.x-w/2, a.y-r-h],[a.x-w/2, a.y+r],[a.x+r-2, a.y-h-2],[a.x+r-2, a.y+2],[a.x-r-w+2, a.y-h-2],[a.x-r-w+2, a.y+2]];
    var ok=null;
    for(var i=0;i<cands.length;i++){
      var c=cands[i], bx=[c[0],c[1],c[0]+w,c[1]+h];
      if(bx[0]<2||bx[1]<2||bx[2]>W-2||bx[3]>H-2) continue;
      var hit=false; for(var j=0;j<boxes.length;j++){ var o=boxes[j]; if(bx[0]<o[2]&&bx[2]>o[0]&&bx[1]<o[3]&&bx[3]>o[1]){ hit=true; break; } }
      if(!hit){ ok=bx; break; }
    }
    if(ok){ lb.el.style.left=(ok[0]-a.x).toFixed(1)+'px'; lb.el.style.top=(ok[1]-a.y).toFixed(1)+'px'; lb.el.style.visibility='visible'; boxes.push(ok); }
    else lb.el.style.visibility='hidden';
  });
}
function applyHotelVis(){
  btnHotels.setAttribute('aria-pressed', S.hotels?'true':'false');
  if(!map || !scene) return;
  if(S.hotels) scene.hotelGroup.addTo(map);
  else { map.removeLayer(scene.hotelGroup); if(S.sel && S.sel.type==='h' && !S.sel.booked) map.closePopup(); }
  placeLabels();
}

/* 视图适配：上方留出提示条的位置，右侧留出按钮列 */
function fitPad(){ var W=map.getSize().x, nb=mapnote.offsetTop+mapnote.offsetHeight; return {tl:[40, Math.max(W<520?82:60, nb+26)], br:[W<520?56:70, 58]}; }
function fitTo(anim){
  if(!scene || !scene.fit.length) return;
  var p=fitPad(), o={paddingTopLeft:p.tl, paddingBottomRight:p.br, maxZoom:16};
  FITB = LF.latLngBounds(scene.fit);
  FITZ = Math.min(16, map.getBoundsZoom(FITB, false, LF.point(p.tl).add(p.br)));
  if(anim && !reduce()) map.flyToBounds(FITB, Object.assign({duration:.5}, o));
  else map.fitBounds(FITB, Object.assign({animate:false}, o));
  placeLabels();
}
function drawMap(anim){
  if(!map) return;
  buildScene();
  var dv = S.view==='overview' ? null : byId[S.view];
  var key = dv ? dv.city+'|'+(dv.region||'') : 'ov';
  fitTo(anim && lastKey!==null && key===lastKey);
  lastKey = key;
  btnHotels.hidden = !scene.hasHotels;
}
document.getElementById('btnIn').addEventListener('click', function(){ if(map) map.zoomIn(); });
document.getElementById('btnOut').addEventListener('click', function(){ if(map) map.zoomOut(); });
document.getElementById('btnFit').addEventListener('click', function(){ if(!map) return; map.closePopup(); fitTo(true); });
btnHotels.addEventListener('click', function(){ S.hotels=!S.hotels; store('hotels',S.hotels); applyHotelVis(); });

/* 弹出说明 */
function popHtml(o){ return '<div class="pop"><h4>'+esc(o.n)+'</h4>'+(o.en?'<div class="en">'+esc(o.en)+'</div>':'')+(o.note?'<p>'+esc(o.note)+'</p>':'')+(o.links?'<div class="links">'+o.links+'</div>':'')+'</div>'; }
// 按钮列和左上角提示条盖在地图上面，弹窗自动平移时避开它们
function openPop(o, ll, r){
  var W=map.getSize().x, tl=document.querySelector('.tools'), top=mapnote.offsetTop+mapnote.offsetHeight+8, right=tl.offsetWidth+18;
  map.openPopup(LF.popup({maxWidth:Math.min(260, W-right-24), minWidth:Math.min(200, W-right-24), offset:[0, 5-r], autoPanPaddingTopLeft:[12, top], autoPanPaddingBottomRight:[right, 12]}).setLatLng(ll).setContent(popHtml(o)));
}
function markSel(sel){ if(scene) scene.marks.forEach(function(m){ var el=m.mk.getElement(); if(el) el.classList.toggle('sel', m===sel); }); }
function setListOn(id, fromList){
  document.querySelectorAll('.stop.on,.hotel.on').forEach(function(x){ x.classList.remove('on'); });
  var el=document.getElementById(id); if(el){ el.classList.add('on'); if(!fromList && !isNarrow()) el.scrollIntoView({block:'nearest', behavior: reduce()?'auto':'smooth'}); }
}
function clearSel(){ markSel(null); document.querySelectorAll('.stop.on,.hotel.on').forEach(function(x){ x.classList.remove('on'); }); S.sel=null; }
function hideCallout(){ if(map) map.closePopup(); clearSel(); }
// 从列表点进来：点不在视野里就先移过去，再弹出说明
function focusOn(ll, show){
  var p=map.latLngToContainerPoint(ll), sz=map.getSize(), sc=scene;
  if(p.x<50||p.x>sz.x-50||p.y<80||p.y>sz.y-60){
    map.once('moveend', function(){ if(scene===sc) show(); });
    map.setView(ll, Math.max(map.getZoom(), FITZ-.25), {animate:!reduce()});
  } else show();
}
function gmGo(A, B, mode){
  var tm = mode==='walk' ? 'walking' : (/^(taxi|car|tour)$/.test(mode) ? 'driving' : 'transit');
  return 'https://www.google.com/maps/dir/?api=1&origin='+A[0]+','+A[1]+'&destination='+B[0]+','+B[1]+'&travelmode='+tm;
}
function stopLinks(s){ var l=''; if(s.q) l+='<a class="lk" href="'+gmSearch(s.q)+'" target="_blank" rel="noopener">地图</a>'; if(s.link) l+='<a class="lk" href="'+esc(s.link.u)+'" target="_blank" rel="noopener">'+esc(s.link.l)+'</a>'; return l; }
function hotelLinks(h, c){ return '<a class="lk" href="'+gmSearch(h.q)+'" target="_blank" rel="noopener">地图</a>'+(h.areaOnly?'':'<a class="lk" href="'+booking(h,c)+'" target="_blank" rel="noopener">Booking 按日期查价</a>'); }

function isNarrow(){ return window.matchMedia && window.matchMedia('(max-width: 899px)').matches; }
function findMark(f){ for(var i=0;i<scene.marks.length;i++){ if(f(scene.marks[i])) return scene.marks[i]; } return null; }
function select(i, fromList){
  var d=byId[S.view]; if(!d) return; var s=dayStops(d)[i];
  if(!map || !scene){ setListOn('stop-'+i, true); return; }
  var m=findMark(function(m){ return m.i===i; });
  function show(){ openPop({n:s.n, en:s.en, note:s.note, links:stopLinks(s)}, s.ll, 12); markSel(m); setListOn('stop-'+i, fromList); S.sel={type:'s', i:i}; }
  if(fromList){ focusOn(s.ll, show); if(isNarrow()) revealMap(); } else show();
}
function selectHotel(hi, fromList){
  var d=byId[S.view]; if(!d) return; var h=(HOTELS[d.city]||[])[hi]; if(!h) return;
  if(!map || !scene){ setListOn('hotel-'+hi, true); return; }
  var bk=isBooked(h);
  if(!S.hotels && !bk){ S.hotels=true; store('hotels',true); applyHotelVis(); }
  var m=findMark(function(m){ return m.hotel===hi; });
  function show(){ openPop({n:h.n, en:(bk?'已订 · ':'')+h.area, note:h.note, links:hotelLinks(h, CITY[d.city])}, h.ll, bk?16:11); markSel(m); setListOn('hotel-'+hi, fromList); S.sel={type:'h', i:hi, booked:bk}; }
  if(fromList){ focusOn(h.ll, show); if(isNarrow()) revealMap(); } else show();
}
function revealMap(){ var r=mapBox.getBoundingClientRect(); if(r.bottom<120 || r.top<0){ mapBox.scrollIntoView({block:'start', behavior: reduce()?'auto':'smooth'}); } }

/* ---------- 面板 ---------- */
var panel=document.getElementById('panel');
function xferHtml(list){
  return '<div class="xfers">'+list.map(function(x){
    return '<div class="xfer"><div class="who"><b>'+esc(x.code)+'</b>'+(x.who?'<span>'+esc(x.who)+'</span>':'')+'</div><div class="end">'+esc(x.dep)+'</div><div class="arrow">→</div><div class="end r">'+esc(x.arr)+'</div>'+(x.note?'<div class="nt">'+esc(x.note)+'</div>':'')+'</div>';
  }).join('')+'</div>';
}
// 一段路怎么坐：每小段一行（线路号、方向、上下车站、时间），最后是 Google 地图实时查询
function txHtml(leg){
  var segs=legSegs(leg).filter(function(g){ return !g.auto; }), drive=segs.every(function(g){ return /^(walk|taxi|car)$/.test(g.mode); });
  return '<div class="tx">'+segs.map(function(g){
    if(g.mode==='walk') return '<div class="txr walk"><span class="ln walk">步行</span><span class="tn">'+esc([g.time, g.note].filter(Boolean).join('，'))+'</span></div>';
    var info=[g.time, g.freq].filter(Boolean).join(' · ');
    return '<div class="txr"><span class="ln '+g.mode+'">'+esc(g.line||TXMODE[g.mode])+'</span>'+
      '<span class="tk">'+esc(TXMODE[g.mode]+(g.dir?' · '+g.dir:''))+'</span>'+
      (g.on||g.off ? '<span class="tw">'+esc((g.on||'')+' → '+(g.off||''))+'</span>' : '')+
      (info ? '<span class="tm">'+esc(info)+'</span>' : '')+
      (g.note ? '<span class="tn">'+esc(g.note)+'</span>' : '')+'</div>';
  }).join('')+'<a class="lk txl" href="'+gmGo(leg.from, leg.to, drive?'car':'bus')+'" target="_blank" rel="noopener">'+(drive?'导航':'实时查询')+'</a></div>';
}
function renderDay(d){
  var c=CITY[d.city], idx=DAYS.indexOf(d), stops=dayStops(d), st=startPt(d), en=endPt(d), legs=dayLegs(d), legAt={};
  legs.forEach(function(l){ legAt[l.i]=l; });
  var sunLL = c.sun, sun=sunTimes(d.date, sunLL[0], sunLL[1], c.tz);
  var md=d.date.slice(5).replace('-','/');
  var h='<div class="dayhead" style="--c:var(--'+d.city+')">'+
    '<div class="bigdate">'+md+'<small>'+d.wd+'</small></div>'+
    '<div class="tagline"><span class="ctag">'+esc(d.tag)+'</span></div>'+
    '<h2>'+esc(d.title)+'</h2></div>';
  h+='<p class="lede">'+esc(d.lede)+'</p>';
  h+='<div class="meta"><span>'+c.name+'日出 <span class="mono">'+sun.rise+'</span></span><span>日落 <span class="mono">'+sun.set+'</span></span><span>'+(c.tz===11?'夏令时 UTC+11':'UTC+10，不用夏令时')+'</span></div>';
  var seen={}, chips=[];
  legs.forEach(function(l){ legSegs(l).forEach(function(g){ if(!g.line || g.mode==='walk' || seen[g.mode+g.line]) return; seen[g.mode+g.line]=1; chips.push('<span class="ln '+g.mode+'">'+esc(g.line)+'</span>'); }); });
  if(chips.length) h+='<div class="txsum"><span>今天坐</span>'+chips.join('')+'</div>';
  h+='<div class="pager"><button class="pbtn" type="button" data-go="'+(idx>0?DAYS[idx-1].id:'overview')+'">‹ '+(idx>0?DAYS[idx-1].date.slice(5).replace('-','/'):'总览')+'</button><button class="pbtn" type="button" data-go="'+(idx<DAYS.length-1?DAYS[idx+1].id:'')+'"'+(idx<DAYS.length-1?'':' disabled')+'>'+(idx<DAYS.length-1?DAYS[idx+1].date.slice(5).replace('-','/'):'行程结束')+' ›</button></div>';
  if(d.options){
    var cur=Math.min(S.opt[d.id]||0, d.options.length-1);
    h+='<div class="opts" style="--c:var(--'+d.city+')"><span class="lab">白天选一个方向：</span>'+d.options.map(function(o,i){ return '<button class="obtn" type="button" data-opt="'+i+'" aria-pressed="'+(i===cur)+'">'+esc(o.label)+'</button>'; }).join('')+'</div>';
  }
  if(d.before){ h+='<h3 class="sec">抵达</h3>'+xferHtml(d.before); }
  h+='<h3 class="sec">路线</h3><ol class="stops" style="--c:var(--'+d.city+')">';
  if(st && st.n!=='住处出发'){ h+='<li class="stop stay"><div class="n" style="background:var(--muted)">起</div><div class="body"><div class="ttl"><span class="nm">'+esc(st.n)+'</span>'+(st.t?'<span class="t">'+esc(st.t)+'</span>':'')+'</div>'+(st.note?'<p class="note">'+esc(st.note)+'</p>':'')+'</div></li>'; }
  var num=0;
  stops.forEach(function(s,i){
    var lab = s.kind==='stay' ? '宿' : (s.kind==='air' ? '机' : String(++num));
    var tx = s.tx && legAt[i] ? txHtml(legAt[i]) : '';
    var mode = !tx && s.mode && s.mode!=='walk' ? '<span class="via">'+MODE[s.mode]+'</span><br>' : '';
    h+='<li class="stop'+(s.opt?' opt':'')+(s.kind?' '+s.kind:'')+'" id="stop-'+i+'" data-i="'+i+'"><div class="n">'+lab+'</div><div class="body">'+mode+
      '<div class="ttl"><span class="nm">'+esc(s.n)+'</span>'+(s.t?'<span class="t">'+esc(s.t)+'</span>':'')+(s.sunset?'<span class="t">日落 '+sun.set+'</span>':'')+'</div>'+
      '<div class="en">'+esc(s.en||'')+'</div>'+tx+(s.note?'<p class="note">'+esc(s.note)+'</p>':'')+
      '<div class="links">'+stopLinks(s)+'</div></div></li>';
  });
  if(en && (en.n!=='回住处' || en.tx)){
    var etx = en.tx && legAt.end ? txHtml(legAt.end) : '';
    h+='<li class="stop stay"><div class="n" style="background:var(--muted)">'+(en.n==='回住处'?'回':'终')+'</div><div class="body">'+(!etx && en.mode&&en.mode!=='walk'?'<span class="via">'+MODE[en.mode]+'</span><br>':'')+'<div class="ttl"><span class="nm">'+esc(en.n)+'</span>'+(en.t?'<span class="t">'+esc(en.t)+'</span>':'')+'</div>'+etx+'</div></li>';
  }
  h+='</ol>';
  var gm=dayGm(d);
  if(gm){
    var pts=gm.list.map(function(k){ var s = k==='start'?st:(k==='end'?en:stops[k]); return s.q || (s.en+' '+c.en); });
    h+='<a class="routebtn" href="'+gmDir(pts, gm.mode)+'" target="_blank" rel="noopener">在 Google 地图打开今天的路线</a>';
  }
  if(d.after){ h+='<h3 class="sec">之后</h3>'+xferHtml(d.after); }
  if(d.tips && d.tips.length){ h+='<h3 class="sec">提醒</h3><ul class="tips">'+d.tips.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>'; }
  // 住宿
  var nightCity = d.night ? CITY[d.night] : null;
  if(nightCity){
    var hs=HOTELS[d.night], onMap = d.night===d.city && (!d.region || d.region==='gc'), bkh=bookedHotel(d.night);
    h+='<h3 class="sec">今晚住宿 · '+nightCity.name+'</h3>';
    h+='<p class="hstay"><b>'+nightCity.cin.slice(5).replace('-','/')+'</b> 入住 → <b>'+nightCity.cout.slice(5).replace('-','/')+'</b> 退房，共 '+nightCity.nights+' 晚。'+(bkh ? '已订 <span class="bkn">'+esc(bkh.n)+'</span>，其余是候选。' : '全部是候选，还没有预订。')+(onMap?'':' 酒店位置在 '+firstDayOf(d.night)+' 的地图上看。')+'</p>';
    // 已订的排在最前；id / data-h 仍用 HOTELS 里的原序号，和地图标记对应
    var order = hs.map(function(ho,hi){ return {ho:ho, hi:hi}; }).sort(function(a,b){ return isBooked(b.ho) - isBooked(a.ho); });
    h+='<div class="hotels" style="--c:var(--'+d.night+')">'+order.map(function(x){
      var ho=x.ho, hi=x.hi, bk=isBooked(ho), dist = haversine(ho.ll, nightCity.anchor.ll);
      return '<div class="hotel'+(bk?' booked':'')+'"'+(onMap?' id="hotel-'+hi+'"':'')+' data-h="'+(onMap?hi:'')+'"><div class="hn">'+(bk?'<span class="bk">已订</span>':'')+'<b>'+esc(ho.n)+'</b><span>'+esc(ho.area)+'</span></div>'+
        '<div class="tags">'+ho.tags.map(function(t){return '<span class="tag'+(/A\$/.test(t)?' d':'')+'">'+esc(t)+'</span>';}).join('')+'<span class="tag d">距 '+esc(nightCity.anchor.n)+' '+dist.toFixed(1)+' km</span></div>'+
        '<p>'+esc(ho.note)+'</p><div class="links">'+hotelLinks(ho, nightCity)+'</div></div>';
    }).join('')+'</div>';
  } else {
    h+='<h3 class="sec">今晚</h3><p class="hstay">在飞机上。我回自己的住处。</p>';
  }
  h+='<p class="fine">距离是直线距离；价格是估价或之前查到的参考价，营业时间和交通时刻出发前再核对一遍。线路号和班次是 2026 年 10 月查的，坐车前点「实时查询」确认。</p>';
  panel.innerHTML=h;
  panel.querySelectorAll('.pbtn').forEach(function(b){ b.addEventListener('click', function(){ var g=b.getAttribute('data-go'); if(g){ setView(g); window.scrollTo({top: isNarrow()? 0 : window.scrollY, behavior:'auto'}); } }); });
  panel.querySelectorAll('.obtn').forEach(function(b){ b.addEventListener('click', function(){ S.opt[d.id]=+b.getAttribute('data-opt'); store('opt',S.opt); render(); }); });
  panel.querySelectorAll('.stop[data-i]').forEach(function(li){ li.addEventListener('click', function(e){ if(e.target.closest('a')) return; select(+li.getAttribute('data-i'), true); }); });
  panel.querySelectorAll('.hotel').forEach(function(el){ var hi=el.getAttribute('data-h'); if(hi==='') { el.style.cursor='default'; return; } el.addEventListener('click', function(e){ if(e.target.closest('a')) return; selectHotel(+hi, true); }); });
}
function firstDayOf(city){ for(var i=0;i<DAYS.length;i++){ var d=DAYS[i]; if(d.city===city && d.region!=='gor') return d.date.slice(5).replace('-','/'); } return ''; }
function renderOverview(){
  var h='<div class="dayhead" style="--c:var(--syd)"><div class="bigdate">13<small>天 · 10 晚酒店</small></div><div class="tagline"><span class="ctag" style="--c:var(--ink)">2026.10.23 – 11.04</span></div><h2>全程总览</h2></div>';
  h+='<p class="lede">点下面任意一天、顶部日期，或者地图上的城市，查看当天路线和候选酒店。</p>';
  h+='<h3 class="sec">每天安排</h3><ol class="dlist">';
  h+='<li><div class="drow static"><span class="md">10/23</span><span class="wd">五</span><span class="tt"><b>朋友济南出发</b><span>13:05 东航，武汉转机</span></span><span class="nt">飞机上</span></div></li>';
  DAYS.forEach(function(d){
    var c=CITY[d.city], night = d.night ? CITY[d.night].name : '飞机上';
    h+='<li><button class="drow" type="button" data-go="'+d.id+'" style="--c:var(--'+d.city+')"><span class="md">'+d.date.slice(5).replace('-','/')+'</span><span class="wd">'+d.wd.slice(1)+'</span><span class="tt"><b><i class="dot-c"></i>'+esc(d.title)+'</b><span>'+esc(d.tag)+'</span></span><span class="nt">住 '+night+'</span></button></li>';
  });
  h+='<li><div class="drow static"><span class="md">11/04</span><span class="wd">三</span><span class="tt"><b>11:30 到济南</b><span>11/5 上班</span></span><span class="nt">到家</span></div></li></ol>';
  h+='<h3 class="sec">交通</h3><div class="tblwrap"><table class="ftable"><tbody>'+FLIGHTS.map(function(f){ return '<tr><td>'+f.d+'</td><td><b>'+esc(f.code)+'</b> <span class="r">'+esc(f.r)+'</span><span class="sub">'+esc(f.who)+(f.sub?' · '+esc(f.sub):'')+'</span></td><td class="r" style="text-align:right;white-space:nowrap">'+esc(f.p)+'</td></tr>'; }).join('')+'</tbody></table></div>';
  h+='<h3 class="sec">当地交通怎么付钱</h3><ul class="tips pay">'+PAY.map(function(p){ return '<li>'+(p.c?'<i class="dot-c" style="--c:var(--'+p.c+')"></i>':'')+esc(p.t)+'</li>'; }).join('')+'</ul>';
  h+='<h3 class="sec">住宿</h3><div class="stays">'+['syd','mel','gc','bne'].map(function(k){ var c=CITY[k]; return '<div style="border-top:3px solid var(--'+k+')"><b>'+c.name+'</b><span class="n">'+c.nights+'</span> <span>晚</span><br><span>'+c.cin.slice(5).replace('-','/')+' → '+c.cout.slice(5).replace('-','/')+'</span>'+(bookedHotel(k)?'<span class="bkd">已订 · '+esc(bookedHotel(k).s||bookedHotel(k).n)+'</span>':'')+'</div>'; }).join('')+'</div>';
  h+='<p class="fine">底图和路线数据来自 OpenStreetMap，景点和酒店按真实坐标放置；线路走向仅供参考，坐车以站牌和实时查询为准。实际导航请点每一站的「地图」，在 Google 地图里打开。机票价格是之前查到的参考价，购买前重新查。</p>';
  panel.innerHTML=h;
  panel.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click', function(){ setView(b.getAttribute('data-go')); if(isNarrow()) window.scrollTo({top:0}); }); });
}

/* ---------- 切换 ---------- */
function render(){
  if(S.view==='overview') renderOverview(); else renderDay(byId[S.view]);
  syncRail();
  drawMap(true);
}
function setView(v){
  if(v!=='overview' && !byId[v]) v='overview';
  S.view=v; store('view',v);
  try{ history.replaceState(null,'','#'+v); }catch(e){}
  render();
}
document.addEventListener('keydown', function(e){
  if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    var ids=['overview'].concat(DAYS.map(function(d){return d.id;})); var i=ids.indexOf(S.view);
    var j = e.key==='ArrowRight'? Math.min(ids.length-1,i+1) : Math.max(0,i-1);
    if(j!==i){ e.preventDefault(); setView(ids[j]); }
  } else if(e.key==='Escape'){ hideCallout(); }
});

buildRail();
var initial = (location.hash||'').replace('#','');
if(!byId[initial] && initial!=='overview'){ initial = byId['d'+TODAY.slice(5).replace('-','')] ? 'd'+TODAY.slice(5).replace('-','') : load('view','overview'); }
S.view = (initial==='overview'||byId[initial]) ? initial : 'overview';
render();
loadLeaflet(0);
})();
</script>

</body></html>
